body:
  text: 重刻淨土切要序今夫苦樂縱橫一靈萬變升沉往返疲苦遷流世人但知一時是人身未曾放眼而觀也故於日用上繁興執著境強心弱勝氣有時而衰六道茫茫未卜其託於何所矣然海月天星心光淡住六凡四聖位業空靈能以佛之心為心則心強而境弱以心吞境念念融之一佛當心諸魔皆退生前無障命盡往生惟此勤念彌陀可稱換骨靈丹耳嗚呼千萬易得一效難求道術儒宗禪教戒律修行之途大而廣捨念佛一法當從何處出頭耶今翻刻淨土切要一書略論其機以告三生眷屬咸豐辛酉年四月佛誕日淨業學人無相室謹序蓮池大師云雜念是病念佛是藥念佛正治雜念而不能治者因念不親切也旨哉言乎耕塘表兄夙具慧根研究經典每日虔誦佛號綿密無間近得勸修淨土切要一編其示人念佛之法在誠信專一而以斷除妄想為工夫增長淨因直至彼岸洵修心之寶筏也因重付剞劂以公同志自度度人遞相化導無復魔業謂非無量功德哉咸豐乙卯秋七月潘曾瑩序勸修淨土切要序一勸發心念佛二勸實心念佛三勸求生淨土四勸正助雙修勸修行人從根本處修為奉道者勸念佛儀式發願回向文十念法附録念佛不可附邪教錫明居士念佛不可當錢用錫明居士寄庫無益説龍舒居士跋跋臨終舟楫要語
