body:
  text: 淨業行人真益願纂述或問孔子曰人有遷家而忘其妻者有諸孔子曰又有甚焉桀紂則忘其身若以道眼觀之今人皆忘其身矣何則自早晨開目離寢至夜就寢閉目無非塵勞未嘗暫省吾身是皆忘其身也且人之於身以日言之莫大於飢渴必為飲食之備以歲言之莫大於寒暑必為裘葛之備以終身言之莫大於生死而不為之備何愚之甚哉非真愚也特不知有修淨土之法可為生死之備耳譬如人至遠地必先覔下處然後出去幹事則抵暮昏黑有投宿之地先覔下處者修淨土之謂也抵暮昏黑者大命將盡之謂也有投宿之地者生蓮華中不至沉淪惡趣受諸苦惱之謂也由此觀之念佛而修淨土修淨土而往生經言壽命無量有樂無苦其為終身之備不亦大哉乃今猶有知而不修者其故何歟噫吾知之矣或因家無靜室或因不能茹素或因事煩心勞殊不知念佛正要在鬧處鍊不拘行住坐臥嘈雜之所能一心不亂則一聲勝似數聲所謂心淨即土淨也如念佛必長齋固屬甚美然惟出家則能若在家而有出世之心亦必求全責備直苦人之所難非所以勸人也苟能晨起至誠念佛今生既可滅罪消愆命終亦得超生淨域至於念佛之數清間者固多多益善若事冗而發無上菩提之心亦必例此是強人所不能亦非所以勸世也蓋終日雖忙豈無片刻之暇何不挪一茶之頃心不外馳而念佛在勞心者可藉以養心勞力者亦可藉以蓄力事之有益無損孰有過於此乎況不特獲驗乎壽終并可見功於現世經云若人受持我佛名號者見世當獲十種功德利益一晝夜常得諸天大力神將并諸眷屬隱形守護二常得二十五大菩薩如觀世音等及一切菩薩常隨守護三常為諸佛晝夜護念阿彌陀佛常放光明攝受此人四一切惡鬼若夜叉羅剎皆不能害一切毒蛇毒龍悉不能害五一切火難水難冤賊刀箭牢獄杻械橫死枉死悉皆不受六先所作罪皆悉消滅所殺冤命彼蒙解脫更無執對七夜夢正直或復夢見阿彌陀佛勝妙色身八心常歡喜顏色光澤氣力充盛所作吉利九常為一切世間人民恭敬供養禮拜猶如敬佛十命終之時心無怖畏正念現前得見阿彌陀佛及諸菩薩聖衆手持金臺接引往生西方淨土盡未來際受勝妙樂佛切戒人妄語必不自妄語以誑人世人之妄語者非以規利則以避害佛無求於世何規利之有佛視生死如刀斫虗空何避害之有是佛無所用其妄語也苟信佛無妄語宜熟玩四則勸言修生淨土并須藉以勸人自度度人功德無量切弗置之高閣視為無稽之談負此婆心設無佛緣不信者尚祈轉送流通遞相化導使在在齊登覺路人人共出迷津是所望於諸君焉一勸發心念佛諸善人世間有千條路萬條路如何獨勸人念佛因人之念頭所係甚重牽魂引魄造命生身莫不由此念善生天堂念惡入地獄念魔便成魔念佛便成佛所以勸人念佛十方三世百千萬億佛如何只勸人念阿彌陀佛因阿彌陀佛曾發四十八願願願度衆生又因阿彌陀佛與娑婆衆生有緣無論僧俗男女能念佛無不攝受故專心持名即蒙接引往生彼國就是惡人能至心懺悔持名亦可帶業往生所以勸人念阿彌陀佛今人都曉得念佛好但為多生纍劫貪瞋癡愛種業甚深故難發心諸善人當知娑婆世界苦惱極多儞看世人有極貧極賤的有多災多病的有鰥寡孤獨的有妻不賢子不肖的各人有各人的苦境各人有各人的苦情其苦固不待言即如富貴康強之人庭闈聚順之家件件俱足種種如意是不苦的了怎奈壽命有限且不説那短命的縱饒儞活到百歲大限到來難免一死到這時節只落得一棺長閉萬事皆休昔日豪華而今安在説到此處仍舊是苦若在生行惡的死去地獄餓鬼畜生隨業受報直至惡業償清才得轉個人身就是在生行善的也不過種些福報之因猶恐前世孽重先要償完則轉世便要受苦墮入三塗縱使前世無大罪業後世即得福報且不説福無十全受福者一般也有苦處就令十分快樂富貴享盡仍舊貧賤況一享富貴容易作業保不得不墮在地獄餓鬼畜生隊裏漫説人間富貴縱行了極大善事生在天上天福享盡仍舊墮落終究是苦因三界中有這般苦處所以我佛慈悲説一卷阿彌陀經教人念佛得生極樂世界永離諸苦長享快樂這是金口親宣佛戒妄語豈反妄語欺人但人類不一不發心念佛的因由也不一有不知道念佛的利益不念有不信心不念有貪著眼前的快樂不念有因諸般礙不念種種不同殊不知這一聲佛無人不可念無人不當念若必欲舉天下盡棄士農工商百工技藝事而念佛是直阻人非所為勸也蓋持名者凡一切所為皆不相妨既不廢業又不廢錢并不犯王法而可免地獄輪回之苦非世之有利無害一舉而兩得事耶即如清間人正好念佛或家有恆業不勞經營或有父兄子弟可靠自身安間無事這等人是他前世修積來的不可多得正好就此修行若虗度光陰空過一生最是可惜冗忙人正好念佛縱不能如無事之人六時課誦也須忙裏偷間龍舒淨土文云每日早晨至心十念心專願切亦得往生若依此法門強似一生忙碌到頭成空富貴人正好念佛富貴縱然長久怎奈身不堅牢何不就此百樣現成發心念佛貧窮人正好念佛前世不修今生貧苦今再不修一死之後如稱槌落井何時得出況此念佛法門並不耽誤儞求衣求食有此方便如何不修少年人正好念佛乘精神強壯求無上菩提日積月纍功不唐捐況人命不齊儘多夭折若克潛修藉佛護而享上壽回視夭者始信用功之不謬衰老人正好念佛過了許多歲月或事猶未了終不了矣何不以有限之光陰急急求生淨土是真能了人所不能了有兒女人正好念佛常言有子萬事足又道兒孫自有兒孫福這等人正好安心學佛他卻癡愛不捨自甘終身作馬牛全不想費了多少心血竟與自己一無干涉生死到來縱極孝的也不能相代鰥寡孤獨之人正好念佛他不少人不來討債人亦不少他故無還債孑然一身不憂男婚不愁女嫁何不趁此專意西方跳出生死夫少一分愛戀者即少一分纏縛少一分纏縛即少一分業障與世緣淺便與佛緣深故孰如此輩生無憂慮死無挂礙真世間第一等宜念佛事半而功倍者也妻妾恩愛的正好念佛古人道夫妻恰似同林鳥大限來時各自飛又道骨肉恩情相愛難期白首團圓何如雙修極樂他時把臂蓮臺作無量劫之佛友較有限之恩愛豈非更美骨肉怨憎的正好念佛冤家相會雖親不親不早解釋益結益深儞若常念彌陀現世即得解脫婦女們正好念佛因婦女本是五漏墮落之身正愁不得脫離好容易得這念佛法門還不急急修行離了苦趣況阿彌陀佛所發四十八願第三十五願設我得佛十方無量不可思議諸佛世界其有女人聞我名字歡喜信樂發菩提心厭惡女身壽終之後復為女像者不取正覺以此婦女專修淨土必能脫離女身證菩提果但不可念佛惑於邪見耳殘疾人正好念佛體相不具已難比平人若再墮落勢必入於三塗其苦更甚有疾病人正好念佛強壯者尚防猝死況病是死因縱不就死終朝病苦纏綿即如活受地獄急急修行猶恐其遲遇災難人正好念佛前世業熟今生莫避全仗佛力免此災殃善人正好念佛善人佛護念更得力若但作善而不念佛比較他人不作善者雖覺勝之然亦不過今生後世享些頑福福盡仍要墮落莫如作善更兼念佛直生極樂上品永無墮落之時惡人正好念佛作惡受罪世人皆知只因未曾檢點儞今五更睡醒一一思量若果是惡急求懺悔改惡從善一心念佛佛大慈悲無不濟度便檢察生平無惡不造或已過之事成大逆障萬分莫救或現在之境騎虎難下只得昧心或娼妓訟師謀多人之財命或屠兒漁戶害億萬之生靈若據因論果當受長劫劇苦之報無可救援然斷不可自暴自棄只圖現在得過且過須知佛開念佛一門正憐念爾等應受苦報衆生其極苦導以極樂儞雖作此大黑業而能遇念佛往生法門就是多生纍劫莫大的善緣極大的造化亟當趁此苦報未到時決意勇猛念佛靠定這一念成就決定往生的願力尋善知識開示講論增進信心試看從前僧雄俊張善和輩便是極惡往生的榜樣趁早趁早莫疑莫疑除此念佛一門更無直捷救度之法也習空定人正好念佛有一等人愛著靜定以為一念不生放下又放下或得一二日空境便謂此即是金剛大定執著不捨既不與宗門合轍又不知研教觀心豈知饒經八萬劫終是落空亡莫若早晚念佛回向西方儘不妨禪定又不礙往生千穩萬當豈不是好誦經呪人正好念佛但要誠心持誦不得視為故事念佛誦經均須回向西方定得往生參禪人正好念佛參禪大悟破死生已識得自性彌陀然行解相應名之曰祖故二祖尚須我自調心六祖尚説悟時自度正宜綿密熏修斷不可自負狂見毀謗淨土莫説生死到來不能作主即能生死自由少有毫釐繫念難免三途業因陰境現前瞥爾隨去依舊漏入輪回可惜可惜真可惜百錯千錯又萬錯何如念佛求生萬修萬往也講教人正好念佛千經萬論雖所開修行法門不同總須斷盡見思二惑才得脫卻輪回然談何容易其西竺性相空密諸宗姑置勿論即如東土天台賢首唯識三家莫不以斷見思為超出生死之位此見思惑斷之位在聲聞已是四果羅漢在圓乘已是相似分證自佛法東流以來能有幾人到此且經論中多有讚歎往生切宜勇猛念佛依教奉行尼姑道姑正好念佛現居佛地清淨道場朝晚至誠念佛為自己修解脫為世人作榜樣如是真實求生淨土較他人功德更無量何則世之婦女每信儞們化導故能以念佛正路相勸不惟自度并堪度人其功豈不偉歟即外之布施亦不求而自至矣若以念佛為化緣之由及延生寄庫死後冥府作錢諸邪説誑人非徒誤人直以自誤也以上都是遵佛祖遺教不是憑空杜撰惟願見者聞者各自警心要知娑婆真苦西方真樂娑婆之苦輪回不休西方之樂劫數無量切莫説苦不知苦説苦容易受苦實難些微之苦已覺難受況於劇苦不可聞樂不信樂佛言不信何言可信世間忠信不欺之人説一句話人尚不疑況於佛言善哉善哉急早回頭發心念佛二勸實心念佛諸善人今既發心念佛必須實心去念不可有名無實大凡無善根之人斷不能念佛故古人云聞佛法難真信更難今能發心念佛這個善根卻要時刻增長不可自己哄了自己至於念佛兼通宗教者事理雙融既不執理廢事亦不事外見理此等人於事一心理一心諸説了然無疑可決其上品上生金臺接引更不須別人勸讚我亦毋庸贅詞今但於事邊念佛者約分三等第一等的信心真切老老實實一心念佛雖一般穿衣喫飯幹辦營為卻惟信此一事行也阿彌陀坐也阿彌陀縱饒忙似箭不離阿彌陀精進不退今日如此明日也如此今年如此明年也如此這等人佛定垂護他命終之日定生極樂世界第二等的或心不專一他也知念佛的好處但俗念重正念輕方念佛時心裏又想別事或一暴十寒念得一日卻隔了十日似這等念佛饒儞念到老也不濟事不過種個善根罷了他世有緣觸著這點善根從新老實修行一番方可望有成就第三等的口念心不念他原不知念佛的好處但慕修行之名今日這裏佛會隨行逐隊念一日明日那裏佛會隨行逐隊念一日名雖念一日佛其實只是空過説間話時候多念佛時候少在佛堂裏原有貪瞋癡愛之心出了佛堂就免不得貪瞋癡愛的事這比第二等的更差多了以上三等人第一等最少第三等也不甚多惟有第二等的人人易犯因娑婆衆生物欲所蔽妄念難除所以如此試想做一切俗事果能專心於此尚不分心於彼甚至於目不覺色耳不覺聲鼻不覺香舌不覺味身不覺觸夜以繼日的做去這就是用心真切樣子也念佛必須如此才能得力苦依儞這樣懶散念法雖種得一點善根但恐惡根深善根淺就令這一世無惡業保不得儞後世不作惡以惡掩善善根雖種難於發生又不知幾劫幾生才得出頭豈不大苦急須起真切心發勇猛力世緣可放下者即放下人命不常切勿留戀自誤雖有不可放下的也不礙儞念佛譬如儞有一件切事在心雖辦別事這一件切事還肯忘否能如此念佛自然沒有雜念也不至一暴十寒了這是心不真切的還有心甚真切卻為魔嬈亂不得自由念佛的功德利益他也知得真信得極念佛的方法他也聽得多見得廣但念佛的工夫他卻不能行得足對人説心要專一他卻雜念不絶對人説勇猛精進他卻常常懈怠對人説生死念切他卻悠悠忽忽對人説種種方便他卻為人忘己這是什麼原故因此人前世今生曾種善根所以心裏明白稍能粗識淺解又因往昔罪深業重所以為魔嬈亂有內魔有外魔內魔是心裏時醒時迷一切貪瞋癡愛此心才離彼心又起外魔是境遇屯邅種種障緣逼迫身心不得安穩不幸遇此魔頭即當對佛發願勤求懺悔消得宿愆古來修行人都有此事然要緊一著在念佛之心不因魔退立定此志百折不回任他種種障緣我這一聲佛號總不離心魔力雖強仗此萬德洪名與之抵對不計利害死活只管念去六字念四字念高聲念低聲念朗念默念行道念禮拜念行住坐臥念安間念忙亂也念樂時念惱時也念明白念昏沉也念連夢中也念念得心酸淚下念得火滅灰寒念得神欽鬼敬念得天喜魔降一聲佛為萬劫千生消業障一聲佛為四恩三有啓因緣正是搾到油來擊撞之聲益狠船當浪起搖棹之聲益悲鑊湯在後蓮池在前雖有千萬人阻我不念誓不退轉久之久之必蒙佛慈冥加障緣消釋淨緣成就佛不負人必滿所願諸善人業障重者如此業障輕者可知有業障者如此無業障者更可知矣善哉善哉各宜努力實心念佛三勸求生淨土諸善人今既實心念佛須發願求生淨土不可徒求福報世人聽這一句話未免大驚小怪想修行原為求福念佛得福正是趁心滿意之事如何反不要福報若説淨土豈我等凡夫可生況功行淺薄如何容易得生諸善人這等想頭大錯了要知福報是有盡的試看世人或祖父富貴子孫貧賤或早年富貴晚年貧賤豈不是福報有盡不特此也這世修行二世受福二世不修三世又受苦或有畜生報盡才得人身人道有虧又墮畜類升沉不定所以名為苦海浮沉不特此也或有財無子或有子無財或有壽孤窮或聰明壽短或富而愚蠢或貴而招災或自身無恙眷屬凋零或家口粗安自身殘病有一缺一所以名為缺陷世界你道福報是趁心滿意的麼若生西方則不然蓮花化生身體香潔相貌端正其心智慧無有煩惱衣食自然無病無老隨佛自在逍遙安養其人之壽又且無量從此直成佛道更不墮落其餘種種快樂説不能盡皆是佛口親説見於阿彌陀經及諸大乘經由此看來人間富貴轉眼成空西方快樂無窮無盡還不急急發願求生若説我是凡夫恐不能往生要知我佛如來正為我等凡夫障深慧淺若修別樣法門皆是豎出三界恐一生或不能了當生死是以特地開出念佛一法願人往生以滿度盡衆生之願你為甚如此自棄不思自奮辜負我佛如許慈悲若以為功行淺薄要知萬德洪名無善不收無惡不滅正是極大極深極廣極圓的功行所以念佛一聲能滅八十億劫無量重罪不可視念佛為平淡無奇將來輕看了又須知念佛之人全仗阿彌陀佛大悲願力攝受當初阿彌陀佛有四十八願願願度人第十八願云我作佛時十方無央數世界諸天人民至心信樂欲生我剎十聲念我名號必遂來生惟除五逆誹謗正法不得是願終不作佛因佛有此大願所以一心稱念阿彌陀佛名號西方七寶池中即生蓮花一朵標記此人姓名他日於中託生臨命終時阿彌陀佛與觀音勢至二菩薩現身接引從古至今往生已不可勝數或其人預知命終日期及到其時自説見佛菩薩遂安然化去的或有旁人同見瑞光同聞異香及鼓樂音聲的並非杳茫都載在往生諸傳如今念佛真切者少所以往生不多人因少見故不十分深信殊不知千里一人百里一人這千里百里往生的獨非凡夫麼十年一人五年一人這十年五年往生的獨非凡夫麼這些往生豈都有三祇功行麼也不過能用心真切而已阿彌陀經中明説若有善男子善女人聞説阿彌陀佛執持名號若一日乃至七日一心不亂即得往生極樂國土總因阿彌陀佛大願大力譬如一隻大船不論何物但得上船即到彼岸不憂沉溺所以古人云餘門學道如蟻子上於高山念佛求生似風帆行於順水順水行船又遇順風豈不快上加快這就是仗佛願力的道理諸善人順水順風是上船以後之事假如你不肯上船將如之何所以還要自己願力專切如今念佛人或為病苦發心或為保佑家室或為現在消災延壽或為來生妄求富貴少有為生死大事求生淨土如人往南往北須有預定之方預定往南到出門時斷不從北去你今不發願求淨土到命終時如何得往淨土去也這是不發願求生的還有願不專切口裏也説願生西方心中却時時貪著物欲雖偶然發求生之願總不能終身如一日得生固好不生也罷全無切實之功仍與不發願一般嗚呼濁世衆生貪戀繁華甘心淪墜不求出離真莫如之何也已總而言之念佛法門不可思議西方快樂無有比量念佛求生正合佛心願生即生不願不生願不專切還如不願非佛不度你無決志若以不可思議法門去求世間有盡的福報如以明珠彈豈不可惜善哉善哉真誠發願求生淨土四勸正助雙修諸善人今既求生淨土須修正助二行使命終往生不惟決定無疑且增高品位正修雖有多門總重持名一法以持名易而得功亦易古德於持名正行中開出信行願三門前篇義已略具茲更引申四條願有志者參而行之一者篤信佛語你想無始以來輪回六道不能解脫今生何幸而發此出世之心又何幸而得聞念佛往生至易至捷之法尚是遲疑不決其病由於信佛未能真切故耳須知智慧禪定戒律見識力量神通慈悲苦行還有勝於佛否則佛所説法斷不錯路斷不誤人是以稱佛言為真語者實語者不誑語者佛説極惡人臨終十念成就亦得往生你一生作為未必至於極惡持名之數又多於十念若不得往生是佛誤人引人走錯路那有是理你今只要信得真念念專切日日無問捱至臨命終時正念求生全不顛倒定得往生無疑譬如種瓜決定得瓜種豆決定得豆又如陽燧取火磁石引針但得機感相投斷無不應驗者切勿自生障閡裹足不前其或疑情深重雖聞如是説而終覺意中狐疑不決者此由業障堅強須時常提起正念加以早晚懺悔日深月久自能慧根披露諦信無疑其念佛亦便十分得力矣此為正行起信開首緊要一條也二者親善知識念佛雖極易事然念不得力覺許久毫無好處適遇境緣不順便生退惰或聞禪觀諸法又思參禪習觀改換法門若不親近明師益友警䇿評論決錯誤不少故修行雖要自己用功全藉知識之力經云善知識為得道全因緣假如自己工夫用錯了賴知識指點歸正自己工夫懈怠了賴知識警覺䇿勵我所不知的望知識講明我所已知的須知識印證若通文義之人時當研究經教增長淨土信根亦須與善知識講明切究方免泥解自誤省庵法師云世間小技尚不可無師友況念佛是出生死法門若無知識從何開發誰為引導一念不覺遂成淪墜所誤不小至臨終時善知識更為緊要善導和尚云凡人命終欲生淨土須不得怕死常念此身多苦不淨惡業種種交纏若得捨此穢身超生淨土受無量快樂解脫生死苦趣如脫敝衣得換珍服當放下身心莫生戀著凡遇病時便念無常一心念佛待死可囑家人及看病人為我念佛不得説眼前間雜語將終之際親屬不可垂淚哭泣及發嗟歎懊惱之聲惑亂心神失其正念一時同聲念佛助其往生待身冷盡方可哀泣才有絲毫戀世之心便成罣礙不得解脫若得明曉淨土之人頻來策勵極為大幸余每見世人平時念佛求生西方臨病却又怕死不説往生解脫之事死門事大須自家著力觀善導和尚如此開示可知此係要緊關鍵先須親近知識庶臨終時得其相助之力此為正行提䇿熏修緊要一條也三者常加精進精進有多般如後所列每日功課及十念等法或每日限定多少佛號此聽各人籌量忙間立定課程盡此報身一日不可間斷是謂恆常精進遇清間時或一晝夜乃至七日三七日四十九日剋期專念以期速證三昧是謂勇猛精進其念佛之法無論一人多人念趺坐經行念默持出聲念皆須一心靠定佛號字字分明才覺糢糊急提起覺照或落於無記或流於妄想旋覺旋提將此一句佛號熏逼意根塞斷雜念昏沉兩路是為念佛正徹不可過急急則難久不可過緩緩則易散又不可希冀入定全不作意放下隨口而念最易入於輕昏境界蓋念佛重在一心不亂臨命終時全仗這個念頭徑入蓮胎念佛人不可不知也逮至一心之極不期禪定現前而自現此是工夫純熟時候與放下隨口入於輕昏者逈然不同玩之玩之至於體究念即無念不妨無念而念此一念即是空假中三諦即是事理四法界即是唯識唯心二觀即是實相無相涅槃妙心此乃上根理一心念法然亦不離一心靠定佛號字字分明而念此為正行持名軌則緊要一條也四者願勤憶切以此念佛功德求生淨土是為願然須時常懇切祈求於一切善隨喜回向於一切惡懺悔回向隨時隨事無不願在西方則淨土緣熟臨終往生就如輕車熟路毫無阻礙至於憶想彌陀尤為念佛之要楞嚴經大勢至章憶佛念佛現前當來必定見佛憶如切事繫心或憶彌陀依正莊嚴如觀想佛菩薩法報化身及白毫垂手圓光化佛蓮華等相或憶彌陀悲願功德何等憐愍我輩救拔衆生焦思渴想戀戀不忘於持名中正不妨低回輾轉憶念雙并意與俱往神與相融此正是一心不亂切勿謂念頭夾雜自生疑慮蓋一心者專注於一境之謂如謀財好色之徒其精神魂魄千般算計都歸并在一件事上必期於到手而後已正不得不謂之一心也故念佛人要造次常不忘佛久久成性任運常憶能遮一切惡念成就一切淨因功德古德偈云臨終不能觀及念但作生意知有佛此人氣絶即往生大法鼓經如是説蓋臨終不能觀念但得心中有佛即如意而生況憶念不忘者哉此為正行憶願專切緊要一條也能具以上四正行往生已決定無疑然更須廣修六助行更能勝利娑婆如苦海念佛如乘船生淨土如到彼岸助行如帆楫盤費等物有了帆楫盤費則此船一往無礙直到彼岸何為助行一者禮敬三寶翹勤五體廣修供養此是修行人本分事乃世人念佛疏懶者多不特日無常禮甚至見佛不拜至於一切供養更屬缺然其故不過因口稱易身禮難空言易力行難不知難行能行斯為可貴雖説修行在內不在外但外邊恭敬之容亦不可少且即外可以徵內故古人云真修行人視紙畫木雕即同真佛愛如父母敬如君王早晚朝參必誠必敬拜如山倒起似雲升出而問訊人而問訊百里千里常如目前一飲一食先須供養龍舒淨土文曰供佛齋僧燒香獻花懸幡建塔種種三寶上崇奉皆可回向西方況求生淨土之人已是三寶弟子若不敬重三寶其求生之心必不真切故須各盡心力切勿疏懶二者懺悔業障懺者懺其已往悔者悔其將來修行人以懺悔為要普賢菩薩尚有懺悔之願何況凡夫因無量劫來身口意三業所造已深俱能為種種障礙故名業障若不懺悔業障不除譬如垢衣須加洗滌譬如塵鏡須加刮磨垢去則衣新塵去則鏡明障去則身心清淨也三者戒惡行善龍舒淨土文云全持齋戒又禮佛念佛讀誦大乘經典解第一義以此回向西方必上品上生所謂齋者不食肉不飲酒不食五辛所謂戒者殺生偷盜邪淫為身三業妄言綺語兩舌惡口為口四業貪欲瞋恨邪見為意三業能持而不犯是為十善若犯而不持是為十惡持前四戒加以不飲酒是為五戒持五戒而修淨土者亦不失中品往生若不能持五戒豈可不戒殺殺為五戒之首是不殺為大善殺則為大惡也蓮池大師云奉勸世人既是念佛便要依佛所説要積德修福要孝順父母要忠事君王要兄弟相愛要夫妻相敬要至誠信實要柔和忍辱要公平正直要陰隲方便要慈愍一切不殺害生命不淩辱下人不欺壓小民但有不好心起著力念佛定要念退這不好心如此才是念佛人定得往生四者割捨情愛世人於骨肉每多愛戀且視財産如性命亦貪著不忘濁世這邊情重淨土那邊自然情輕到命終時神魂必歸重處譬如一株大樹那邊偏重至後倒時自然倒在重一邊這是必然之理從來妻子骨肉總是有緣則聚緣盡則散到得散後彼此都不相認即如你多生以來妻子骨肉不少今在何處你還恩愛麼想到此不容不淡其中還有惡緣聚會眷屬即是冤家不知不覺暗受其害豈不更錯愛了至於財産等物及種種嗜好轉眼成空尤當看破五者解釋冤結凡冤仇未結者不可結如殺生偷盜邪淫等事及貪瞋等情皆是結冤仇之因能戒則不結不結則無冤仇已結者宜解釋如眷屬為冤仇及外人以橫逆相加以至犬咬蛇傷都非無故俱有宿冤須要歡喜忍受與他解釋切不可一來一往益結益深雖淨土是橫超法門果能一意求生即莫大冤仇不能阻我往生然究不若早為解釋更覺心無挂礙又要知多生纍劫以來冤對不少因緣未遇豈能一一盡得解釋須要佛前發願願以此念佛功德普利一切冤家仇對設我作佛先度此類衆生以此慈心消彼宿怨加之願力實有利益自然化仇為恩六者發憤為雄現在修淨土之人也有不及我也有勝似我不及我的切不可去比較他説我還勝他這就無進步了須要把勝我的人來做個比較想他與我一般念佛他如何精進我如何懈怠他如何專一我如何散亂彼既丈夫我亦爾若不發憤為雄眼看他高超極樂我依舊浮沉苦海現今稱朋道友言笑可親轉眼別聖分凡霄壤莫及豈不愧哉豈不悲哉如是思維自然勇往直前一生取辦不待他生今之修行人有發願來世再修行的據他説自量今生功行淺薄來世再加功行方可望有成就真是大錯經云一失人身萬劫難復就令復得人身能保復知修行麼又據他説今生發願仗此願力來世定知修行這又錯了既發願如此得力何不發願現世即生淨土自然必得往生何必又要來世且你今生不求往生來世又能求往生麼萬一來世或遇別的障緣不復修行不惟不能往生并保不得不失人身了故古人云此身不向今生度更向何生度此身念佛人切須立定此志視現處娑婆如寄旅寓又須視自己是淨土中人品詣何等高超自然綿密精進必至證果而後已此尤往生淨土切要之一法也以上六助行略説如此若廣説則有萬行是在各人虗心求益實力承當凡有資於淨緣勤而行之可也善哉善哉往生如願正助雙修勸修行人從根本處修今諸大善人或男或女既已發心修行須從根本處修起何謂根本忠君王孝父母敬師長愛兄弟別夫婦信友朋教子孫睦宗族奉有德恕無識守誠敬勤懺悔省己過忍人辱以此數事著力方謂入手工夫不致茫無頭緒久久修持直至聖賢地位自然憂入聖域矣今或有人修持卻為誠敬而於根本之地全不照顧全不講究吾恐三教聖人斷不收不講忠孝仁義之人也君恩不論做官不做官父母師長不論存與歿俱是我受恩深重之人不思所以報之則不可故發心修行人功德無論大小持誦無論多寡悉皆向佛回向報答君親師長深恩其餘兄弟夫婦朋友子孫宗族各思所以化之教之成就一切善果惟父母生我者也若不生我我身何來根本尤切報稱尤急國家所以以孝治天下故言移孝可以作忠求忠臣於孝子之門父母存何幸如之必須竭力孝養細細勸導父母奉佛令其一心念佛將來必要父母成佛而後已此出世法之大孝子也若父母已歿何不幸如之亦必須勤勤懇懇為父母修持念佛讀誦大乘經典哀求我佛接引父母往生淨土終身如是方可謂盡我子道矣倘不於此用心獨為自己修持所謂盲修瞎煉吾恐根本之地有虧決難成就所願詩云技葉未有害本實先撥若於根本之地實心做去勤勤懺悔懺者懺已往之罪孽悔者悔現在之愆尤所謂過而不改是謂過矣過而能改善莫大焉倘能改過自新即是大善我佛慈悲未有不垂憐者也再能發心普度一切衆生同歸佛道俱脫輪回苦趣恰合佛心如影隨形必定成佛所謂成己可以成物利人即為自利者也為奉道者勸此書專勸世人一心念佛求生淨土得脫輪回苦趣永享快樂也或有人素奉道法或瞻星禮斗或拜誦道藏經懺極為誠敬經年纍月得不退轉觀此念佛法門不是不信佛法因奉道多年必欲令其捨此道法去熟就生而一心念佛似亦非善為勸人之法也況三教聖人無非教人從五倫做起孝弟忠信禮義廉恥存理遏欲改惡從善收束身心性命之學而且道藏經典無處不有蓮花化生得生淨土句語即玉皇經懺中亦有是語若既禮拜道藏再加以念佛工夫讀誦佛經勤懇懺悔求生淨土更為得力臨命終時決生蓮品位必臻高品幸勿以儒釋道三家以為不是一家作三樣看承是所禱切念佛儀式如清間勵志者每日早晚盥手焚香先誦阿彌陀經一卷往生呪三遍焚香之火切戒向竈內取再能加誦金剛經大懺悔文及一切大乘經典更好阿彌陀佛身金色相好光明無等倫白毫宛轉五須彌紺目澄清四大海光中化佛無數億化菩薩衆亦無邊四十八願度衆生九品咸令登彼岸南無西方極樂世界大慈大悲阿彌陀佛南無阿彌陀佛或五百聲千聲以至萬聲愈多愈好南無觀世音菩薩南無大勢至菩薩南無清淨大海衆菩薩各十聲發願回向文慈雲懺主作或念蓮池大師西方發願文亦可弟子某某一心皈命極樂世界阿彌陀佛願以淨光照我慈誓攝我我今正念稱如來名為菩提道求生淨土佛昔本誓若有衆生欲生我國至心信樂乃至十念若不生者不取正覺以此念佛因緣得入如來大誓海中承佛慈力衆罪消滅淨因增長若臨欲命終自知時至身無痛苦心不貪戀意不顛倒如入禪定佛及聖衆手執金臺來迎接我於一念頃生極樂國花開見佛即聞佛乘頓開佛慧廣度衆生滿菩提願我今稱念阿彌陀真實功德佛名號惟願慈悲哀攝受證知懺悔及所願往昔所造諸惡業皆由無始貪瞋癡從身語意之所生一切我今皆懺悔願我臨欲命終時盡除一切諸障礙面見彼佛阿彌陀即得往生安樂剎願以此功德莊嚴佛淨土上報四重恩下濟三塗苦若有見聞者悉發菩提心盡此一報身同生極樂國十方三世一切佛一切菩薩摩訶薩摩訶般若波羅蜜十念法世事煩雜不能如前奉持可行此法久久專切亦得往生每日清晨服飾之後面西正立合掌連聲稱阿彌陀佛盡一氣為一念如是十氣名為十念但隨氣之長短不限佛數氣極為度其聲不高不低不緩不急調停得中連屬不斷意在借氣束心令心不散念畢亦必發願回向附録念佛不可附邪教錫明居士念佛乃正大法門雖覺平易實該圓頓竊恐愚夫愚婦半塗厭怠被人誘入天主無為等教反以淨土一門為非生犯重刑死遭地獄可哀可憫奉勸念佛之人老實念去念到一心不亂自然花開見佛切勿揑怪求神妄生別想非徒無益而又害之念佛不可當錢用錫明居士出世大法莫如念佛每見世人信根不正皆謂所念之佛死後可當錢用以至臨終顛倒第念佛固能一心求生淨土命終決不入冥府若既至冥府決不能當錢用且此説從未見於經典奉勸念佛之人必須皈依阿彌陀佛及觀音勢至諸大菩薩萬不可以此出世大法僅作應酬無常使費也寄庫無益説龍舒居士遍覽藏經並無陰府寄庫之説奉勸世人以寄庫之費為一切真實善事一心念佛必得往生若不為此而徒事寄庫無論奢願無益只汝志在陰府死必入陰府矣若云今生所積來生受用是則生前善惡果報無憑惟此不義所積之財可以主持幽冥轉移造化恐無此昧昧之天道也譬如人不務去惡行善乃寄錢於禁子牢頭待其下獄用錢免罪豈不謬哉是書自癸丑歲春仲購之坊間細讀一過言言金玉字字珠璣言雖淺近而於至理中流出無人不能奉行也且教人從五倫中著手做起非似尋常講説佛法徒喃喃念佛而已可謂近裏著己無出其右者如能照此行去鞭追入裏悔過遷善未有不往生淨土脫離輪回苦趣永享快樂者也惜板在嘉興無從刷印急欲付刻又無資力直至今年春杪得𫎇桃潭主人慨捐刻資又募諸善知識樂助印費廣為送人二載心事一朝釋然何幸如之惟願處處齊歸覺路人人共脫輪回轉移六賊為六神通速離八苦得八自在對衆為大衆宣揚在家為一家解説若智若愚皆有分是男是女總堪修佛言不信何言可信人道不修何道可修火急進步時不待人各請直下承當莫使此生空過咸豐五年歲次乙卯秋七月耕塘黃贊元謹跋於勿憚改齋南窗臨終舟楫要語佛制亡僧焚化原為令其離分段之假形而證真常之法身故遵佛以來僧衆奉為永規奈法道陵夷延久斃生如今釋子以焚化了事不依制度往往停龕一日即行焚化則大違佛制可乎佛説人有八識即知識也前五識名眼耳鼻舌身識第六識意識第七末那識第八阿賴耶識人之生也唯此第八識其來最先七識六識五識次第後來及其死也亦此第八識其去最後餘識次第先去蓋第八識即人之靈識俗謂之靈魂是也此識既靈故人於初受母胎之時彼即先來故兒在母腹中即是活動之物於人死氣斷之後彼不遽去必待通身冰冷無一點暖氣彼識方去識去則此身毫無知識若有一處稍暖彼尚未去仍知痛苦此時切忌穿衣盤膝搬動等亦復難受不過口不能言身不能動而已孝經云壽暖識三者常不相離如人身有暖則有識在識在則壽尚未盡故古來多有死去三日而復生者載在典章歷歷可考儒家亦有三日大殮之禮緣眷屬恩愛尚望其萬一復生也今我等僧家順理而行雖不癡心望其復生安可不體其痛苦之情而遽爾焚燒其慈悲之心安在耶兔死狐悲各傷其類物尚如此況同為人類又同為僧類耶具人情痛苦之極瞋心易起以瞋心故即致墮落如經言阿耆達王立佛塔寺功德巍巍臨終侍人持扇誤墜王面王起一念瞋心死後即墮蛇身後遇沙門説經聞法乃得生天觀此可知亡者識未去時即行焚化令其因痛生嗔更加墮落尤為慘中之慘我與亡者何𬽦何恨乃以好心作比惡事若言事屬渺茫無從稽考則佛經具載豈可不信佛言不信何言可信耶又何必為佛弟子耶總因生者不憐死者之苦只圖迅速了事故無暇細察冷暖習以為常縱有言及此理者反笑以為迂致令亡者有苦難伸嗚呼世之極苦者不過亡之命已乎生如活龜脫殼死似生蟹落湯八苦交煎痛不可言其照應病者惟要細心切勿與病人間談雜話令生思念亦勿悲哀喧譁及入殯等事皆不與亡者預知總勸他萬緣一齊放下一心念佛如不喜念佛當沉心靜念調養自病以聽世數待通身死透則主人翁已去再遲兩三時方可浴洗穿衣如身冷轉硬用熱湯淋洗將熱布搭於亡者臂肘膝灣自軟矣料理齊備惟請人念佛頂妙論云行善者熱氣從下至上作惡者從上至下俟通身冷盡熱氣歸頂者聖道也至眼天道至心人道至腹餓鬼道至膝畜生道至腳板地獄道然生死大事誰人能免任汝行善一生臨終生一惡念即墮惡趣一生造惡發一善念便生善道末後要關焉不慎歟焉不慎歟
